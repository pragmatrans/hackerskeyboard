name: build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 8 (for old Gradle/AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK / NDK / CMake
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "no sdkmanager"; exit 1; }
          echo "SDKM=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-26" "build-tools;28.0.3" "ndk;19.2.5345600" "cmake;3.10.2.4988404"
          ln -sfn "$ANDROID_HOME/ndk/19.2.5345600" "$ANDROID_HOME/ndk-bundle"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Gradle 4.10.3
        run: |
          cd /tmp
          curl -sSL -o g.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q g.zip -d /opt/gradle
          /opt/gradle/gradle-4.10.3/bin/gradle --version

      - name: Build
        run: |
          export JAVA_HOME=$JAVA_HOME_8_X64
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          /opt/gradle/gradle-4.10.3/bin/gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
